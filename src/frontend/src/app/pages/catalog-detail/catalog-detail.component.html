<section class="detail-page" *ngIf="detailedModel">
  <button class="back-button" type="button" (click)="back.emit()">← Volver al catalogo</button>

  <article class="detail-layout" [class.loading-fade]="isLoading">
    <div class="detail-media">
      <img [src]="detailedModel.imageUrl" [alt]="detailedModel.title">
    </div>

    <div class="detail-content">
      <span class="eyebrow">{{ detailedModel.category }} · {{ detailedModel.level }}</span>
      <h1>{{ detailedModel.title }}</h1>
      <p class="detail-description">{{ detailedModel.description }}</p>

      <div class="info-grid">
        <section>
          <h2>Materiales Utilizados</h2>
          <ul>
            <li *ngFor="let material of detailedModel.materials">{{ material }}</li>
          </ul>
        </section>

        <section>
          <h2>Caracteristicas</h2>
          <ul>
            <li *ngFor="let feature of detailedModel.features">{{ feature }}</li>
          </ul>
        </section>
      </div>

      <div class="purchase-options" aria-label="Opciones de compra">
        <button type="button" class="option-card" (click)="accessRequested.emit('comprar')">
          <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=500&q=80" alt="Maqueta terminada lista para comprar">
          <span>Comprar ya hecha</span>
          <small>Entrega con acabado final</small>
        </button>

        <button type="button" class="option-card" (click)="accessRequested.emit('personalizar')">
          <img src="https://images.unsplash.com/photo-1516321497487-e288fb19713f?auto=format&fit=crop&w=500&q=80" alt="Personalizacion de maqueta educativa">
          <span>Personalizar</span>
          <small>Ajustes de tamano, colores y detalles</small>
        </button>
      </div>

      <section class="related-section" aria-labelledby="relatedTitle">
        <div class="related-heading">
          <span class="eyebrow">Tambien te puede interesar</span>
          <h2 id="relatedTitle">Maquetas relacionadas</h2>
        </div>

        <div class="related-grid">
          <button
            class="related-card"
            type="button"
            *ngFor="let related of relatedModels"
            (click)="relatedSelected.emit(related)"
          >
            <img [src]="related.imageUrl" [alt]="related.title">
            <span>{{ related.title }}</span>
            <small>{{ related.category }} · {{ related.level }}</small>
          </button>
        </div>
      </section>
    </div>
  </article>
</section>
