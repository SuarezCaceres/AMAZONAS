<app-header *ngIf="page !== 'auth' && page !== 'reset-password'" [activePage]="page" [isLoggedIn]="!!currentUser"
  [userName]="currentUser?.name || ''" (inicioClicked)="showInicio()" (nosotrosClicked)="showNosotros()"
  (catalogClicked)="showCatalog()" (requestsClicked)="showRequests()" (loginClicked)="showLogin()"
  (registerClicked)="showRegister()" (logoutClicked)="logout()" (categoriesClicked)="showCategories()"></app-header>

<app-inicio *ngIf="page === 'inicio'" [isLoggedIn]="!!currentUser" (registerClicked)="showRegister()"
  (catalogClicked)="showCatalog()" (requestsClicked)="showRequests()" (requestAccess)="openStandaloneRequest()" (modelSelected)="showDetails($event)">
</app-inicio>

<app-nosotros *ngIf="page === 'nosotros'" (catalogClicked)="showCatalog()"></app-nosotros>

<app-categories *ngIf="page === 'categories'" (categorySelected)="handleCategoryFromHeader($event)"
  (modelSelected)="showDetails($event)" (loginRequested)="showLogin()" (requestSubmitted)="showRequests()"></app-categories>

<app-catalog *ngIf="page === 'catalog'" [preselectedCategory]="preselectedCategory"
  (viewDetails)="showDetails($event)"></app-catalog>

<app-catalog-detail *ngIf="page === 'detail'" [model]="selectedModel" (back)="showCatalog()"
  (accessRequested)="requestAccess($event)" (relatedSelected)="showDetails($event)"></app-catalog-detail>

<app-auth *ngIf="page === 'auth'" [accessNotice]="accessNotice" [initialView]="authView" (closed)="closeAuth()"
  (authenticated)="completeLogin($event)"></app-auth>

<app-request-form *ngIf="page === 'request'" [model]="selectedModel" [mode]="requestMode" [user]="currentUser"
  (changedMode)="switchRequestMode($event)" (submitted)="handleRequestSubmitted($event)"
  [standaloneRequest]="isStandaloneRequest"></app-request-form>

<app-my-requests *ngIf="page === 'requests'" [user]="currentUser" (viewChat)="handleViewChat($event)"></app-my-requests>

<app-chat *ngIf="page === 'chat'" [autoSelectRequestId]="selectedRequestIdForChat" (closeChat)="showRequests()"></app-chat>

<app-footer *ngIf="page !== 'auth' && page !== 'reset-password' && page !== 'chat'" (catalogClicked)="showCatalog()"
  (loginClicked)="showLogin()"></app-footer>

<app-reset-password *ngIf="page === 'reset-password'" [token]="tokenToReset"
  (completed)="handleResetCompleted()"></app-reset-password>
