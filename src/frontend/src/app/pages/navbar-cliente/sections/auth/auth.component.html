<main class="page-shell">
  <section class="store-preview" aria-hidden="true">
    <div class="paper-bg">
      <div class="paper-line short"></div>
      <div class="paper-line"></div>
      <div class="paper-line"></div>
      <div class="paper-block"></div>
      <div class="paper-row">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </section>

  <div class="overlay">
    <section class="auth-card" style="padding: 2.5rem 1.5rem; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto;">
      <button class="close-button" type="button" aria-label="Cerrar" (click)="closeModal()">x</button>
      
      <div class="logo" style="margin-bottom: 1.5rem; text-align: center;">MA</div>

      <div class="alert info" *ngIf="accessNotice" style="margin-bottom: 1.5rem; padding: 0.75rem; border-radius: 8px; background-color: #f1f5f9; color: #475569; font-size: 0.875rem; border-left: 4px solid #0f172a;">
        {{ accessNotice }}
      </div>

      <!-- Componentes declarativos oficiales de ngx-clerk -->
      <div style="display: flex; justify-content: center; width: 100%;">
        <clerk-sign-in *ngIf="isLogin" [props]="{ appearance: { variables: { colorPrimary: '#0f172a' } } }"></clerk-sign-in>
        <clerk-sign-up *ngIf="!isLogin" [props]="{ appearance: { variables: { colorPrimary: '#0f172a' } } }"></clerk-sign-up>
      </div>
    </section>
  </div>
</main>
