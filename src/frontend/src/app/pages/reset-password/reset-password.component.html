<div class="auth-page">
  <section class="store-preview" aria-hidden="true">
    <div class="paper-bg">
      <div class="paper-line short"></div>
      <div class="paper-line"></div>
      <div class="paper-line"></div>
      <div class="paper-block"></div>
      <div class="paper-row">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </section>

  <div class="overlay">
    <section class="auth-card">
      <button class="close-button" type="button" aria-label="Cerrar" (click)="cancel()">x</button>

      <div class="logo">MA</div>

      <h2>Restablecer Contraseña</h2>
      <p class="subtitle">Escribe tu nueva contraseña a continuación</p>

      <form (ngSubmit)="submitReset()" #resetForm="ngForm">
        <label for="password">Nueva Contraseña</label>
        <div class="input-wrap">
          <span class="input-icon">&#128274;</span>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            required
            minlength="6"
            [(ngModel)]="password"
          >
        </div>

        <label for="confirmPassword">Confirmar Nueva Contraseña</label>
        <div class="input-wrap">
          <span class="input-icon">&#128274;</span>
          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            placeholder="Repite tu nueva contraseña"
            required
            [(ngModel)]="confirmPassword"
          >
        </div>

        <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="alert success" *ngIf="successMessage">{{ successMessage }}</div>

        <button class="primary-button" type="submit" [disabled]="loading">
          <span *ngIf="!loading">Actualizar Contraseña</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </form>
    </section>
  </div>
</div>
