# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
# Define el nombre identificador del microservicio o aplicación en el contexto de Spring.
spring.application.name=backend

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (PostgreSQL)
# ===================================================================
# URL de conexión a la base de datos. 
# Utiliza la variable de entorno 'DB_URL' si existe; de lo contrario, apunta a localhost por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-dry-scene-ac4of9fn-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}

# Credenciales de acceso a la base de datos con respaldos (fallbacks) por defecto.
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_vbg3BVm9afyF}

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# Controla la manipulación automática del esquema de la base de datos.
# 'none' es el valor estándar para producción, ya que evita que Hibernate altere o borre tablas existentes.
spring.jpa.hibernate.ddl-auto=none

# Habilita la impresión de las consultas SQL generadas por Hibernate en la consola.
spring.jpa.show-sql=true

# Da formato estético (con saltos de línea y sangrías) al SQL impreso en consola para facilitar la depuración.
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# ===================================================================
# Llave secreta utilizada para la firma digital de los tokens JWT. Debe tener al menos 256 bits.
security.jwt.secret-key=${JWT_SECRET_KEY:amazonas_super_secret_key_2025_backend_jwt_secure_key_must_be_long_enough}

# Tiempo de expiración del token JWT en milisegundos (24 horas por defecto).
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}

# ===================================================================
# CONFIGURACIÓN DE FLYWAY (MIGRACIONES DE BASE DE DATOS)
# ===================================================================
# Habilita el control de versiones y migraciones automáticas con Flyway al levantar la aplicación.
spring.flyway.enabled=true

# Registra un baseline en el historial si la base de datos ya tiene tablas.
spring.flyway.baseline-on-migrate=true

# Versión asignada para el baseline inicial.
spring.flyway.baseline-version=0
# CONFIGURACIÓN DE CLOUDINARY
# ===================================================================
