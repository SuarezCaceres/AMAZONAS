# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
# Define el nombre identificador del microservicio o aplicación en el contexto de Spring.
spring.application.name=backend

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (PostgreSQL)
# ===================================================================
# URL de conexión a la base de datos. 
# Utiliza la variable de entorno 'DB_URL' si existe; de lo contrario, apunta a localhost por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-dry-scene-ac4of9fn-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}

# Credenciales de acceso a la base de datos con respaldos (fallbacks) por defecto.
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_vbg3BVm9afyF}

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# Controla la manipulación automática del esquema de la base de datos.
# 'none' es el valor estándar para producción, ya que evita que Hibernate altere o borre tablas existentes.
spring.jpa.hibernate.ddl-auto=none

# Habilita la impresión de las consultas SQL generadas por Hibernate en la consola.
spring.jpa.show-sql=true

# Da formato estético (con saltos de línea y sangrías) al SQL impreso en consola para facilitar la depuración.
spring.jpa.properties.hibernate.format_sql=true

# Habilita el procesamiento por lotes para resolver de manera general el problema de rendimiento N+1 en colecciones secundarias.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# ===================================================================
# Llave secreta utilizada para la firma digital de los tokens JWT. Debe tener al menos 256 bits.
security.jwt.secret-key=${JWT_SECRET_KEY:amazonas_super_secret_key_2025_backend_jwt_secure_key_must_be_long_enough}

# Tiempo de expiración del token JWT en milisegundos (24 horas por defecto).
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}

# ===================================================================
# CONFIGURACIÓN DE FLYWAY (MIGRACIONES DE BASE DE DATOS)
# ===================================================================
# Habilita el control de versiones y migraciones automáticas con Flyway al levantar la aplicación.
spring.flyway.enabled=true

# Registra un baseline en el historial si la base de datos ya tiene tablas.
spring.flyway.baseline-on-migrate=true

# Versión asignada para el baseline inicial.
spring.flyway.baseline-version=0
# CONFIGURACIÓN DE CLOUDINARY
# ===================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dhnnfwmqt}
cloudinary.api-key=${CLOUDINARY_API_KEY:195136858522725}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:Fk7fhyv2L7h1GXFLeUxoSN4BTrQ}

# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR DE CORREO (SMTP LOCAL/GMAIL)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:soporteamazzonas@gmail.com}
spring.mail.password=${MAIL_PASSWORD:vneqickvtjoxboto}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# CONFIGURACIÓN DEL FRONTEND
# ===================================================================
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ===================================================================
# CONFIGURACIÓN DE GEMINI AI API
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}

# ===================================================================
# CONFIGURACIÓN DE SUBIDA DE ARCHIVOS (MULTIPART)
# ===================================================================
# Habilita el soporte de subida de archivos multipart/form-data.
spring.servlet.multipart.enabled=true

# Tamaño máximo permitido por archivo individual (ej. imagen o PDF).
# Por defecto Spring Boot limita a 1MB — aumentado a 10MB para archivos de referencia de maquetas.
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo de la petición completa (puede incluir múltiples archivos + campos de formulario).
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# CONFIGURACIÓN DEL CONECTOR TOMCAT
# ===================================================================
# -1 = sin límite en el tamaño del cuerpo que Tomcat "consume/descarta" si hay un error HTTP.
# Sin esta línea, Tomcat aborta el socket con ERR_CONNECTION_RESET cuando el cliente
# envía un cuerpo mayor al límite por defecto del conector (2MB).
server.tomcat.max-swallow-size=-1
