cloudinary.api-key=${CLOUDINARY_API_KEY:195136858522725}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:Fk7fhyv2L7h1GXFLeUxoSN4BTrQ}

# ===================================================================
# CONFIGURACIÓN DE GEMINI AI API
